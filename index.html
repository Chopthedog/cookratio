<body>
  <main class="page">
    <section class="stack" aria-label="Cook Ratio recipe scaler and serving calculator">

      <div class="site-logo-wrap">
        <img
          class="site-logo"
          src="/assets/images/og-image.png"
          alt="Cook Ratio - recipe scaler and serving calculator"
          width="1200"
          height="630"
          decoding="async"
          fetchpriority="high"
        />
      </div>

      <article class="card bio-card" aria-label="Recipe ingredients calculator">
        <div id="ingredientsCardMount"></div>
      </article>

      <div class="calc-outside">
        <button class="calc-main" id="calcMain" type="button">
          DONE
        </button>

        <div class="calc-actions hidden" id="calcActions">
          <button class="calc-action active" type="button" data-mode="ingredient">
            Scale by ingredient
          </button>

          <button class="calc-action" type="button" data-mode="portion">
            Scale by servings
          </button>
        </div>
      </div>

      <article
        class="card bio-card hidden"
        id="proportionIngredientCardWrap"
        aria-label="Scale recipe by ingredient amount"
      >
        <div id="proportionIngredientCardMount"></div>
      </article>

      <article
        class="card bio-card hidden"
        id="proportionPortionCardWrap"
        aria-label="Scale recipe by number of servings"
      >
        <div id="proportionPortionCardMount"></div>
      </article>

      <article
        class="card bio-card hidden"
        id="resultsCardWrap"
        aria-label="Scaled recipe results"
      >
        <div id="resultsCardMount"></div>
      </article>

      <footer class="footer-card">
        Cook Ratio © 2026 · by
        <a href="https://yurisocini.it" target="_blank" rel="noopener noreferrer">
          Yuri Socini
        </a>
      </footer>

    </section>
  </main>

  <script type="module">
    import "/assets/js/unitsmodal.js";
    import { createIngredientsCard } from "/assets/ingredientscard/ingredientscard.js";
    import { createProportionIngredientCard } from "/assets/proportioningredientcard/proportioningredientcard.js";
    import { createProportionPortionCard } from "/assets/proportionportioncard/proportionportioncard.js";

    const ingredientsMount = document.getElementById("ingredientsCardMount");
    const proportionIngredientMount = document.getElementById("proportionIngredientCardMount");
    const proportionPortionMount = document.getElementById("proportionPortionCardMount");

    if (ingredientsMount) {
      ingredientsMount.appendChild(createIngredientsCard());
    }

    if (proportionIngredientMount) {
      const proportionCard = createProportionIngredientCard();
      proportionIngredientMount.appendChild(proportionCard);
      window.proportionIngredientCard = proportionCard;
    }

    if (proportionPortionMount) {
      const proportionPortionCard = createProportionPortionCard();
      proportionPortionMount.appendChild(proportionPortionCard);
      window.proportionPortionCard = proportionPortionCard;
    }
  </script>

  <script src="/assets/js/calccontrols.js"></script>
</body>
