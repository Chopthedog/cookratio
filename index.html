<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- SEO -->
  <title>Cook Ratio | Recipe Scaler & Ingredient Calculator</title>

  <meta
    name="description"
    content="Cook Ratio is a free online recipe scaler. Enter ingredients, quantities and units, then resize any recipe by ingredient amount or by number of servings."
  />

  <meta
    name="robots"
    content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
  />

  <meta name="author" content="Cook Ratio" />
  <meta name="application-name" content="Cook Ratio" />
  <meta name="apple-mobile-web-app-title" content="Cook Ratio" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Canonical -->
  <link rel="canonical" href="https://cookratio.com/" />

  <!-- Temporary alternate URL for Cloudflare Pages -->
  <link rel="alternate" href="https://cookratio.pages.dev/" hreflang="en" />
  <link rel="alternate" href="https://cookratio.com/" hreflang="x-default" />

  <!-- Icons -->
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/images/favicon.png" />

  <!-- Theme -->
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#CFE3FF" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:site_name" content="Cook Ratio" />
  <meta property="og:title" content="Cook Ratio | Recipe Scaler & Ingredient Calculator" />

  <meta
    property="og:description"
    content="Resize recipes instantly by ingredient amount or by servings. A simple online calculator for ingredients, quantities and cooking ratios."
  />

  <meta property="og:url" content="https://cookratio.com/" />
  <meta property="og:image" content="https://cookratio.com/assets/images/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <meta
    property="og:image:alt"
    content="Cook Ratio recipe scaler interface for calculating ingredients and servings"
  />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cook Ratio | Recipe Scaler & Ingredient Calculator" />

  <meta
    name="twitter:description"
    content="Scale recipe ingredients online by ingredient amount or by servings."
  />

  <meta name="twitter:image" content="https://cookratio.com/assets/images/og-image.png" />

  <meta
    name="twitter:image:alt"
    content="Cook Ratio recipe scaler interface for calculating ingredients and servings"
  />

  <!-- Preload important visual asset -->
  <link rel="preload" as="image" href="/assets/images/og-image.png" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://cookratio.com/#organization",
        "name": "Cook Ratio",
        "url": "https://cookratio.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://cookratio.com/assets/images/PTO.png"
        }
      },
      {
        "@type": "WebSite",
        "@id": "https://cookratio.com/#website",
        "url": "https://cookratio.com/",
        "name": "Cook Ratio",
        "publisher": {
          "@id": "https://cookratio.com/#organization"
        },
        "inLanguage": "en-US"
      },
      {
        "@type": "WebApplication",
        "@id": "https://cookratio.com/#webapp",
        "name": "Cook Ratio",
        "alternateName": [
          "Recipe Scaler",
          "Ingredient Calculator",
          "Recipe Ratio Calculator"
        ],
        "url": "https://cookratio.com/",
        "applicationCategory": "FoodApplication",
        "operatingSystem": "Any",
        "isAccessibleForFree": true,
        "inLanguage": "en-US",
        "description": "Free online recipe scaler for resizing ingredients by ingredient amount or by number of servings.",
        "image": "https://cookratio.com/assets/images/og-image.png",
        "publisher": {
          "@id": "https://cookratio.com/#organization"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Scale a recipe by ingredient amount",
          "Scale a recipe by number of servings",
          "Calculate new ingredient quantities",
          "Convert common cooking units automatically"
        ]
      }
    ]
  }
  </script>

  <!-- CSS -->
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/assets/ingredientscard/ingredientscard.css" />
  <link rel="stylesheet" href="/assets/ingredientscard/ingredientsrow/ingredientsrow.css" />
  <link rel="stylesheet" href="/assets/proportioningredientcard/proportioningredientcard.css" />
  <link rel="stylesheet" href="/assets/proportionportioncard/proportionportioncard.css" />
  <link rel="stylesheet" href="/assets/resultscard/resultscard.css" />
</head>

<body>
  <main class="page">
    <section class="stack" aria-label="Cook Ratio recipe scaler">

      <div class="site-logo-wrap">
        <img
          class="site-logo"
          src="/assets/images/og-image.png"
          alt="Cook Ratio - free online recipe scaler and ingredient calculator"
          width="1200"
          height="630"
          decoding="async"
          fetchpriority="high"
        />
      </div>

      <article class="card bio-card" aria-label="Recipe ingredients">
        <div id="ingredientsCardMount"></div>
      </article>

      <div class="calc-outside">
        <button class="calc-main" id="calcMain" type="button">
          DONE
        </button>

        <div class="calc-actions hidden" id="calcActions">
          <button class="calc-action active" type="button" data-mode="ingredient">
            Scale by ingredient
          </button>

          <button class="calc-action" type="button" data-mode="portion">
            Scale by servings
          </button>
        </div>
      </div>

      <article
        class="card bio-card hidden"
        id="proportionIngredientCardWrap"
        aria-label="Scale recipe by ingredient"
      >
        <div id="proportionIngredientCardMount"></div>
      </article>

      <article
        class="card bio-card hidden"
        id="proportionPortionCardWrap"
        aria-label="Scale recipe by servings"
      >
        <div id="proportionPortionCardMount"></div>
      </article>

      <article
        class="card bio-card hidden"
        id="resultsCardWrap"
        aria-label="Recipe scaling results"
      >
        <div id="resultsCardMount"></div>
      </article>

      <footer class="footer-card">
        Cook Ratio © 2026
      </footer>

    </section>
  </main>

  <script type="module">
    import "/assets/js/unitsmodal.js";
    import { createIngredientsCard } from "/assets/ingredientscard/ingredientscard.js";
    import { createProportionIngredientCard } from "/assets/proportioningredientcard/proportioningredientcard.js";
    import { createProportionPortionCard } from "/assets/proportionportioncard/proportionportioncard.js";

    const ingredientsMount = document.getElementById("ingredientsCardMount");
    const proportionIngredientMount = document.getElementById("proportionIngredientCardMount");
    const proportionPortionMount = document.getElementById("proportionPortionCardMount");

    if (ingredientsMount) {
      ingredientsMount.appendChild(createIngredientsCard());
    }

    if (proportionIngredientMount) {
      const proportionCard = createProportionIngredientCard();
      proportionIngredientMount.appendChild(proportionCard);
      window.proportionIngredientCard = proportionCard;
    }

    if (proportionPortionMount) {
      const proportionPortionCard = createProportionPortionCard();
      proportionPortionMount.appendChild(proportionPortionCard);
      window.proportionPortionCard = proportionPortionCard;
    }
  </script>

  <script src="/assets/js/calccontrols.js"></script>
</body>
</html>
